<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ficha Sombria</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap">
<style>
:root{--bg:#efe5d0;--panel:#f7efdd;--field:#fbf6ea;--line:#cdbb98;--fg:#2a1f1a;--muted:#7a6753;--blood:#8e1f26;--ink:#fff4ea;--gold:#8a6a2b;--barbg:#e3d5b6;
--display:"IM Fell English SC",Georgia,serif;--title:"IM Fell English",Georgia,serif;--body:"EB Garamond",Georgia,serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120e0d;--panel:#1c1514;--field:#150f0e;--line:#41312b;--fg:#e8dcc8;--muted:#9a8a78;--blood:#b3303a;--ink:#fff1e8;--gold:#c4a15a;--barbg:#2a1d1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#120e0d;--panel:#1c1514;--field:#150f0e;--line:#41312b;--fg:#e8dcc8;--muted:#9a8a78;--blood:#b3303a;--ink:#fff1e8;--gold:#c4a15a;--barbg:#2a1d1a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.4 var(--body);padding:0 max(12px,env(safe-area-inset-left,0px)) 60px max(12px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.lbl{font:12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],textarea,select{font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:2px;padding:6px 9px;width:100%;min-width:0;outline:none}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.5;font-style:italic}
:focus-visible{outline:2px solid var(--blood);outline-offset:1px}
input[type=number]{appearance:textfield;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
button{font:inherit;cursor:pointer;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:2px;line-height:1}
button:hover{border-color:var(--blood);color:var(--blood)}
.btn{font:12px var(--display);letter-spacing:.1em;text-transform:uppercase;padding:8px 12px;white-space:nowrap}
.btn.pri{background:var(--blood);color:var(--ink);border-color:var(--blood)}
.btn.pri:hover{opacity:.9;color:var(--ink)}
.step{display:flex;gap:6px}.step button{width:32px;height:30px;font-size:18px}

/* HUD fixo */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);margin:0 -12px;padding:8px 12px 10px;border-bottom:1px solid var(--line)}
.hud-in{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.bar1{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bar1 select{flex:1 1 150px;max-width:260px;font-family:var(--title);font-size:18px}
#status{margin-left:auto;color:var(--muted);font-style:italic;font-size:14px}
.vit{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.v{display:flex;flex-direction:column;gap:5px;min-width:0}
.vh{display:flex;align-items:center;gap:6px}
.vh .lbl{width:30px}
.vh input{width:54px;text-align:center;font:24px var(--title);padding:1px 2px;border:0;background:transparent;border-bottom:1px solid var(--line);border-radius:0}
.vh .step{margin-left:auto}
.bar{height:9px;background:var(--barbg);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--blood);transition:width .25s}
.bar.san i{background:var(--gold)}

/* layout */
.wrap{max-width:1280px;margin:14px auto 0;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:980px){.wrap{grid-template-columns:290px minmax(0,1fr) minmax(0,1fr);align-items:start}.hist{grid-column:1/-1}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:14px 16px 16px;min-width:0}
.pt{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.pt h2{margin:0;font:400 17px var(--display);letter-spacing:.08em}
.pt::before{content:"";width:7px;height:7px;transform:rotate(45deg);background:var(--blood)}
.pt::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;gap:10px 12px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}

/* retrato */
.pic{position:relative;width:100%;aspect-ratio:3/4;border:1px solid var(--line);background:var(--field);overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.pic img{width:100%;height:100%;object-fit:cover;display:none}
.pic.has img{display:block}.pic.has .ph{display:none}
.ph{color:var(--muted);font:italic 15px var(--body);text-align:center;padding:10px}
.picbtns{display:flex;gap:6px;margin-top:8px}.picbtns .btn{flex:1;padding:7px 6px}
.name{font:clamp(26px,4vw,34px)/1.15 var(--title);text-align:center;border:0;border-bottom:1px solid var(--line);background:transparent;border-radius:0;padding:8px 4px;margin-bottom:12px}

/* atributos */
.attrs{display:grid;gap:8px;grid-template-columns:repeat(3,minmax(0,1fr))}
.attr{border:1px solid var(--line);background:var(--field);padding:8px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.attr .lbl{font-size:11px}
.num{text-align:center;font:30px var(--title);border:0;background:transparent;padding:0;width:100%;border-radius:0}
.attr .step button{width:28px;height:24px;font-size:15px}
.small{display:grid;gap:8px;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:12px}
.small .num{font-size:24px;border-bottom:1px solid var(--line)}

/* listas */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;gap:6px;grid-template-columns:minmax(0,1fr) auto;align-items:start}
.row .cols{display:grid;gap:5px;min-width:0}
.row.inv{grid-template-columns:minmax(0,1fr) 64px auto}.row.inv .q{text-align:center}
.x{width:34px;height:34px;font-size:18px}
.add{margin-top:12px;font:12px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--blood);border:1px dashed var(--blood);padding:8px 14px}
.add:hover{background:var(--blood);color:var(--ink)}
.empty{color:var(--muted);font-style:italic;margin:0}
textarea{resize:vertical;min-height:110px;line-height:1.45}
.three{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
@media(max-width:560px){body{font-size:16px}.vh input{width:44px;font-size:21px}.vh .step button{width:28px}}
#dlg,#idlg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 12px 24px}
#dlg[hidden],#idlg[hidden]{display:none}
.dbox{background:var(--panel);border:1px solid var(--line);padding:16px;width:100%;max-width:640px;display:flex;flex-direction:column;gap:10px}
#cv{width:100%;height:auto;border:1px solid var(--line)}
#txt{min-height:170px;font:14px/1.4 ui-monospace,Menlo,monospace}
.dbtns{display:flex;gap:6px;flex-wrap:wrap}
#dmsg{color:var(--muted);font-style:italic;font-size:14px;min-height:20px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.slot{position:relative;aspect-ratio:1;border:1px solid var(--line);background:var(--field);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 4px 4px;cursor:pointer;overflow:hidden;box-shadow:inset 0 0 0 2px var(--panel);min-width:0}
.slot:hover,.slot:focus-visible{border-color:var(--gold);color:var(--fg)}
.slot img{width:100%;flex:1;min-height:0;object-fit:contain}
.slot .ic{flex:1;display:flex;align-items:center;justify-content:center;font:32px var(--title);color:var(--muted)}
.slot .nm{font-size:12px;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-top:3px}
.slot .qt{position:absolute;right:3px;top:3px;font:12px var(--display);background:var(--bg);border:1px solid var(--line);padding:1px 5px;color:var(--gold)}
.slot.new{border-style:dashed;color:var(--blood);font:34px var(--title)}
.ipv{width:140px;height:140px;align-self:center;border:1px solid var(--line);background:var(--field);display:flex;align-items:center;justify-content:center;color:var(--muted);font-style:italic;text-align:center;font-size:14px;padding:6px}
.ipv img{max-width:100%;max-height:100%;object-fit:contain}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style></head>
<body>
<div class="hud"><div class="hud-in">
  <div class="bar1">
    <select id="sel" aria-label="Personagem"></select>
    <button class="btn pri" id="save" type="button">Salvar</button>
    <button class="btn" id="new" type="button">+ Novo</button>
    <button class="btn" id="del" type="button">Excluir</button>
    <button class="btn" id="disc" type="button">Discord</button>
    <button class="btn" id="exp" type="button">Exportar</button><button class="btn" id="imp" type="button">Importar</button><input type="file" id="impf" accept=".json,application/json" hidden>
    <span id="status">Pronta.</span>
  </div>
  <div class="vit">
    <div class="v"><div class="vh"><span class="lbl">PV</span>
      <input type="number" inputmode="numeric" data-n="pv" aria-label="PV atuais"><span>/</span><input type="number" inputmode="numeric" data-n="pvmax" aria-label="PV máximos">
      <div class="step"><button type="button" data-step="pv" data-d="-1" aria-label="Diminuir PV">−</button><button type="button" data-step="pv" data-d="1" aria-label="Aumentar PV">+</button></div></div>
      <div class="bar"><i id="pvbar"></i></div></div>
    <div class="v"><div class="vh"><span class="lbl">SAN</span>
      <input type="number" inputmode="numeric" data-n="san" aria-label="Sanidade atual"><span>/</span><input type="number" inputmode="numeric" data-n="sanmax" aria-label="Sanidade máxima">
      <div class="step"><button type="button" data-step="san" data-d="-1" aria-label="Diminuir sanidade">−</button><button type="button" data-step="san" data-d="1" aria-label="Aumentar sanidade">+</button></div></div>
      <div class="bar san"><i id="sanbar"></i></div></div>
  </div>
</div></div>

<main class="wrap">
  <div class="col">
    <section class="panel">
      <button type="button" class="pic" id="pic" aria-label="Escolher aparência"><img id="img" alt="Aparência do personagem"><span class="ph">Toque para adicionar a aparência</span></button>
      <div class="picbtns"><button class="btn" id="up" type="button">Enviar imagem</button><button class="btn" id="rm" type="button">Remover</button></div>
      <input type="file" id="file" accept="image/*" hidden>
    </section>
    <section class="panel">
      <input class="name" type="text" data-f="nome" placeholder="Nome do personagem" autocomplete="off" aria-label="Nome do personagem">
      <div class="grid">
        <label class="fld"><span class="lbl">Idade</span><input type="text" data-f="idade" placeholder="34 invernos"></label>
        <label class="fld"><span class="lbl">Nível</span><input type="text" data-f="nivel" placeholder="1"></label>
        <label class="fld"><span class="lbl">Raça</span><input type="text" data-f="raca" placeholder="Humano"></label>
        <label class="fld"><span class="lbl">Classe</span><input type="text" data-f="classe" placeholder="Caçador de bruxas"></label>
        <label class="fld"><span class="lbl">Origem</span><input type="text" data-f="origem" placeholder="Corvália"></label>
        <label class="fld"><span class="lbl">Ocupação</span><input type="text" data-f="ocupacao" placeholder="Coveiro"></label>
      </div>
    </section>
  </div>

  <div class="col">
    <section class="panel"><div class="pt"><h2>Atributos</h2></div><div class="attrs" id="attrs"></div>
      <div class="small">
        <label class="fld"><span class="lbl">Defesa</span><input class="num" type="number" inputmode="numeric" data-n="def"></label>
        <label class="fld"><span class="lbl">Inic.</span><input class="num" type="number" inputmode="numeric" data-n="ini"></label>
        <label class="fld"><span class="lbl">Mov.</span><input class="num" type="number" inputmode="numeric" data-n="mov"></label>
        <label class="fld"><span class="lbl">Corrup.</span><input class="num" type="number" inputmode="numeric" data-n="cor"></label>
      </div></section>
    <section class="panel"><div class="pt"><h2>Inventário</h2></div>
      <div class="grid" style="margin-bottom:12px">
        <label class="fld"><span class="lbl">Moedas</span><input type="text" data-f="moedas" placeholder="12 de prata"></label>
        <label class="fld"><span class="lbl">Carga</span><input type="text" data-f="carga" placeholder="8 / 15"></label>
      </div>
      <div class="slots" id="inv"></div></section>
  </div>

  <div class="col">
    <section class="panel"><div class="pt"><h2>Habilidades</h2></div><div class="list" id="habs"></div><button type="button" class="add" id="addHab">+ Nova habilidade</button></section>
  </div>

  <section class="panel hist"><div class="pt"><h2>História</h2></div>
    <div class="three">
      <label class="fld"><span class="lbl">Marcas e cicatrizes</span><textarea data-t="marcas" placeholder="O que o mundo deixou gravado no corpo…"></textarea></label>
      <label class="fld"><span class="lbl">Segredo</span><textarea data-t="segredo" placeholder="O que ninguém pode saber…"></textarea></label>
      <label class="fld"><span class="lbl">Anotações</span><textarea data-t="notas" placeholder="Diário de campanha, pistas, nomes, dívidas…"></textarea></label>
    </div></section>
</main>

<div id="idlg" hidden><div class="dbox" role="dialog" aria-label="Item">
  <div class="pt"><h2>Item</h2></div>
  <div class="ipv" id="ipv"></div>
  <div class="dbtns" style="justify-content:center"><button class="btn pri" id="iup" type="button">Enviar imagem</button><button class="btn" id="irm" type="button">Remover imagem</button></div>
  <input type="file" id="ifile" accept="image/*" hidden>
  <label class="fld"><span class="lbl">Nome</span><input type="text" id="iname" placeholder="Cajado de teixo" autocomplete="off"></label>
  <label class="fld"><span class="lbl">Quantidade</span><input type="number" inputmode="numeric" id="iqty"></label>
  <label class="fld"><span class="lbl">Descrição</span><textarea id="idesc" style="min-height:80px" placeholder="Efeito, peso, história…"></textarea></label>
  <div class="dbtns"><button class="btn pri" id="iclose" type="button">Pronto</button><button class="btn" id="idel" type="button">Excluir item</button></div>
</div></div>

<div id="dlg" hidden><div class="dbox" role="dialog" aria-label="Postar no Discord">
  <div class="pt"><h2>Postar no Discord</h2></div>
  <canvas id="cv" width="900" height="540"></canvas>
  <div class="dbtns"><button class="btn pri" id="cpimg" type="button">Copiar imagem</button><button class="btn" id="dlimg" type="button">Baixar PNG</button></div>
  <textarea id="txt" readonly aria-label="Ficha em texto"></textarea>
  <div class="dbtns"><button class="btn pri" id="cptxt" type="button">Copiar texto</button><button class="btn" id="closed" type="button">Fechar</button></div>
  <div id="dmsg"></div>
</div></div>

<script>
(function(){
var KEY='fs2',OLD='ficha-sombria-v1';
var ATTRS=[['forca','Força'],['destreza','Destreza'],['vigor','Vigor'],['inteligencia','Inteligência'],['vontade','Vontade'],['carisma','Carisma']];
var $=function(s){return document.querySelector(s)},$$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
function uid(){return Math.random().toString(36).slice(2,10)}
function fresh(){var n={pv:10,pvmax:10,san:10,sanmax:10,def:10,ini:0,mov:6,cor:0};ATTRS.forEach(function(a){n[a[0]]=10});
  return{id:uid(),ts:0,img:'',f:{},n:n,t:{},habs:[{n:'',d:''}],inv:[]}}
function merge(sv){var b=fresh();if(!sv||typeof sv!=='object')return b;
  if(sv.id)b.id=sv.id;b.ts=sv.ts||0;b.img=sv.img||'';['f','t'].forEach(function(k){if(sv[k])b[k]=sv[k]});
  if(sv.n)Object.keys(sv.n).forEach(function(k){b.n[k]=sv.n[k]});
  if(Array.isArray(sv.habs)&&sv.habs.length)b.habs=sv.habs;if(Array.isArray(sv.inv))b.inv=sv.inv.filter(function(x){return x&&(x.n||x.img||x.d)});return b}
function num(v){var x=parseInt(v,10);return isNaN(x)?0:x}
function status(t){$('#status').textContent=t}

var store={cur:null,chars:{}},S,col=null,timer=null;
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);Object.keys(p.chars||{}).forEach(function(k){store.chars[k]=merge(p.chars[k])});store.cur=p.cur}}catch(e){}
if(!Object.keys(store.chars).length){var first=fresh();try{var o=localStorage.getItem(OLD);if(o)first=merge(JSON.parse(o))}catch(e){}store.chars[first.id]=first;store.cur=first.id}
if(!store.chars[store.cur])store.cur=Object.keys(store.chars)[0];
S=store.chars[store.cur];

/* atributos */
ATTRS.forEach(function(a){var d=document.createElement('div');d.className='attr';
  d.innerHTML='<span class="lbl">'+a[1]+'</span><input class="num" type="number" inputmode="numeric" data-n="'+a[0]+'" aria-label="'+a[1]+'"><div class="step"><button type="button" data-step="'+a[0]+'" data-d="-1" aria-label="Diminuir '+a[1]+'">−</button><button type="button" data-step="'+a[0]+'" data-d="1" aria-label="Aumentar '+a[1]+'">+</button></div>';
  $('#attrs').appendChild(d)});

function bars(){var p=S.n.pvmax>0?Math.max(0,Math.min(1,S.n.pv/S.n.pvmax)):0,s=S.n.sanmax>0?Math.max(0,Math.min(1,S.n.san/S.n.sanmax)):0;
  $('#pvbar').style.width=p*100+'%';$('#sanbar').style.width=s*100+'%'}
function showImg(){var has=!!S.img;$('#pic').classList.toggle('has',has);if(has)$('#img').src=S.img;else $('#img').removeAttribute('src')}
function sel(){var s=$('#sel');s.innerHTML='';Object.keys(store.chars).sort(function(a,b){return(store.chars[a].f.nome||'').localeCompare(store.chars[b].f.nome||'')}).forEach(function(k){
  var o=document.createElement('option');o.value=k;o.textContent=store.chars[k].f.nome||'Sem nome';if(k===S.id)o.selected=true;s.appendChild(o)})}
function fill(){$$('[data-f]').forEach(function(e){e.value=S.f[e.dataset.f]||''});$$('[data-t]').forEach(function(e){e.value=S.t[e.dataset.t]||''});
  $$('[data-n]').forEach(function(e){e.value=S.n[e.dataset.n]});bars();showImg();renderHabs();renderInv();sel()}

/* salvar */
function write(msg){
  S.ts=Date.now();store.chars[S.id]=S;store.cur=S.id;
  try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){status('Sem espaço no navegador (imagem muito grande?)');return}
  if(col){col.doc('c_'+S.id).set({state:S}).then(function(){status(msg||'Salvo na sua conta.')},function(){status('Salvo neste navegador.')})}
  else status(msg||'Salvo neste navegador.')}
function persist(){status('Salvando…');clearTimeout(timer);timer=setTimeout(function(){write()},600)}
function flush(){if(timer){clearTimeout(timer);timer=null;write()}}

document.addEventListener('input',function(e){var el=e.target,d=el.dataset;if(!d)return;
  if(d.f!==undefined){S.f[d.f]=el.value;if(d.f==='nome')sel();persist()}
  else if(d.t!==undefined){S.t[d.t]=el.value;persist()}
  else if(d.n!==undefined){S.n[d.n]=num(el.value);bars();persist()}});
document.addEventListener('click',function(e){var b=e.target.closest('[data-step]');if(!b)return;
  var k=b.dataset.step,v=S.n[k]+num(b.dataset.d);if(k==='pv')v=Math.min(v,S.n.pvmax);if(k==='san')v=Math.min(v,S.n.sanmax);if(v<0)v=0;
  S.n[k]=v;$('[data-n="'+k+'"]').value=v;bars();persist()});

/* personagens */
$('#save').addEventListener('click',function(){clearTimeout(timer);timer=null;write('Personagem salvo ✓')});
$('#sel').addEventListener('change',function(){flush();S=store.chars[this.value];store.cur=S.id;fill();try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}});
$('#new').addEventListener('click',function(){flush();S=fresh();write('Novo personagem criado.');fill();$('[data-f="nome"]').focus()});
var delT=null;
$('#del').addEventListener('click',function(){var b=this;
  if(!delT){b.textContent='Confirmar?';b.style.borderColor='var(--blood)';delT=setTimeout(function(){delT=null;b.textContent='Excluir';b.style.borderColor=''},3000);return}
  clearTimeout(delT);delT=null;b.textContent='Excluir';b.style.borderColor='';
  var id=S.id;delete store.chars[id];if(col)col.doc('c_'+id).delete().catch(function(){});
  if(!Object.keys(store.chars).length){var n=fresh();store.chars[n.id]=n}
  S=store.chars[Object.keys(store.chars)[0]];store.cur=S.id;try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}fill();status('Personagem excluído.')});

/* imagem */
function setImg(file){if(!file||file.type.indexOf('image/')!==0)return;var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){var m=520,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);var x=c.getContext('2d');x.fillStyle='#1c1514';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    S.img=c.toDataURL('image/jpeg',.82);showImg();persist()};im.src=r.result};r.readAsDataURL(file)}
$('#pic').addEventListener('click',function(){$('#file').click()});$('#up').addEventListener('click',function(){$('#file').click()});
$('#file').addEventListener('change',function(){setImg(this.files[0]);this.value=''});
$('#rm').addEventListener('click',function(){S.img='';showImg();persist()});

/* listas */
function mk(t,c,a){var e=document.createElement(t);if(c)e.className=c;if(a)Object.keys(a).forEach(function(k){e.setAttribute(k,a[k])});return e}
function del(l,f){var b=mk('button','x',{type:'button','aria-label':l});b.textContent='×';b.addEventListener('click',f);return b}
function renderHabs(){var box=$('#habs');box.innerHTML='';
  if(!S.habs.length){var p=mk('p','empty');p.textContent='Nenhuma habilidade ainda.';box.appendChild(p);return}
  S.habs.forEach(function(h,i){var row=mk('div','row'),c=mk('div','cols');
    var n=mk('input',null,{type:'text',placeholder:'Nome da habilidade','aria-label':'Nome da habilidade'});n.value=h.n||'';
    var d=mk('textarea',null,{placeholder:'O que ela faz','aria-label':'Descrição','rows':'2'});d.style.minHeight='56px';d.value=h.d||'';
    n.addEventListener('input',function(){S.habs[i].n=n.value;persist()});d.addEventListener('input',function(){S.habs[i].d=d.value;persist()});
    c.appendChild(n);c.appendChild(d);row.appendChild(c);row.appendChild(del('Remover habilidade',function(){S.habs.splice(i,1);renderHabs();persist()}));box.appendChild(row)})}
function renderInv(){var box=$('#inv');box.innerHTML='';
  S.inv.forEach(function(it,i){var b=mk('button','slot',{type:'button',title:(it.n||'Item')+(it.d?' — '+it.d:'')});
    if(it.img){var im=mk('img',null,{alt:it.n||'Item'});im.src=it.img;b.appendChild(im)}else{var ic=mk('span','ic');ic.textContent=(it.n||'?').charAt(0).toUpperCase();b.appendChild(ic)}
    var nm=mk('span','nm');nm.textContent=it.n||'Sem nome';b.appendChild(nm);
    if(it.q>1){var q=mk('span','qt');q.textContent='×'+it.q;b.appendChild(q)}
    b.addEventListener('click',function(){openItem(i)});box.appendChild(b)});
  var a=mk('button','slot new',{type:'button','aria-label':'Novo item'});a.textContent='+';
  a.addEventListener('click',function(){S.inv.push({n:'',q:1,img:'',d:''});renderInv();openItem(S.inv.length-1)});box.appendChild(a)}
$('#addHab').addEventListener('click',function(){S.habs.push({n:'',d:''});renderHabs();persist();var l=$$('#habs .row input');if(l.length)l[l.length-1].focus()});
/* janela do item */
var ci=-1;
function ipv(){var it=S.inv[ci],p=$('#ipv');p.innerHTML='';if(it.img){var im=mk('img',null,{alt:it.n||'Item'});im.src=it.img;p.appendChild(im)}else p.textContent='Sem imagem'}
function openItem(i){ci=i;var it=S.inv[i];$('#iname').value=it.n||'';$('#iqty').value=it.q;$('#idesc').value=it.d||'';ipv();$('#idlg').hidden=false}
function closeItem(){if(ci>=0&&S.inv[ci]){var it=S.inv[ci];if(!it.n&&!it.img&&!it.d)S.inv.splice(ci,1)}ci=-1;$('#idlg').hidden=true;renderInv();persist()}
$('#iname').addEventListener('input',function(){S.inv[ci].n=this.value;renderInv();persist()});
$('#iqty').addEventListener('input',function(){S.inv[ci].q=num(this.value);renderInv();persist()});
$('#idesc').addEventListener('input',function(){S.inv[ci].d=this.value;renderInv();persist()});
$('#iup').addEventListener('click',function(){$('#ifile').click()});
$('#ifile').addEventListener('change',function(){var file=this.files[0];this.value='';if(!file||file.type.indexOf('image/')!==0)return;var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,128/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.inv[ci].img=c.toDataURL('image/webp',.85);ipv();renderInv();persist()};im.src=r.result};r.readAsDataURL(file)});
$('#irm').addEventListener('click',function(){S.inv[ci].img='';ipv();renderInv();persist()});
$('#iclose').addEventListener('click',closeItem);
$('#idlg').addEventListener('click',function(e){if(e.target===this)closeItem()});
$('#idel').addEventListener('click',function(){S.inv.splice(ci,1);ci=-1;$('#idlg').hidden=true;renderInv();persist()});

/* postar no Discord: texto e imagem prontos para colar */
function ftxt(){var n=S.n,f=S.f,L=[],head=[f.classe,f.raca,f.idade,f.nivel?'Nv '+f.nivel:''].filter(Boolean).join(' · ');
  L.push('**'+(f.nome||'Sem nome')+'**'+(head?' — '+head:''));
  L.push('❤️ PV **'+n.pv+'/'+n.pvmax+'** · 🧠 SAN **'+n.san+'/'+n.sanmax+'** · 🛡️ Def '+n.def+' · ⚡ Ini '+n.ini+' · 👣 Mov '+n.mov+' · ☠️ Corr '+n.cor);
  L.push(ATTRS.map(function(a){return a[1].slice(0,3).toUpperCase()+' '+n[a[0]]}).join(' · '));
  var h=S.habs.filter(function(x){return x.n});if(h.length){L.push('**Habilidades**');h.forEach(function(x){L.push('• **'+x.n+'**'+(x.d?' — '+x.d:''))})}
  var it=S.inv.filter(function(x){return x.n});if(it.length||f.moedas){L.push('**Inventário**'+(f.moedas?' ('+f.moedas+')':''));if(it.length)L.push(it.map(function(x){return x.n+(x.q>1?' ×'+x.q:'')}).join(', '))}
  return L.join('\n')}
function card(){var c=$('#cv'),x=c.getContext('2d'),n=S.n,f=S.f;
  function fit(t,w){while(t.length>1&&x.measureText(t).width>w)t=t.slice(0,-2)+'…';return t}
  function draw(im){x.fillStyle='#1c1514';x.fillRect(0,0,900,540);x.strokeStyle='#c4a15a';x.lineWidth=2;x.strokeRect(10,10,880,520);
    if(im){var s=Math.max(240/im.width,320/im.height),sw=240/s,sh=320/s;x.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,40,40,240,320)}else{x.strokeStyle='#41312b';x.lineWidth=1;x.strokeRect(40,40,240,320)}
    x.textBaseline='alphabetic';x.fillStyle='#e8dcc8';x.font='38px Georgia,serif';x.fillText(fit(f.nome||'Sem nome',560),310,82);
    x.fillStyle='#9a8a78';x.font='italic 18px Georgia,serif';x.fillText(fit([f.classe,f.raca,f.idade,f.nivel?'Nível '+f.nivel:''].filter(Boolean).join(' · '),560),310,112);
    [['PV',n.pv,n.pvmax,'#b3303a',160],['SANIDADE',n.san,n.sanmax,'#c4a15a',212]].forEach(function(b){
      x.fillStyle='#e8dcc8';x.font='16px Georgia,serif';x.fillText(b[0]+'  '+b[1]+' / '+b[2],310,b[4]);
      x.fillStyle='#2a1d1a';x.fillRect(310,b[4]+8,560,14);x.fillStyle=b[3];x.fillRect(310,b[4]+8,b[2]>0?560*Math.max(0,Math.min(1,b[1]/b[2])):0,14)});
    ATTRS.forEach(function(a,i){var bx=310+(i%3)*190,by=262+Math.floor(i/3)*74;x.strokeStyle='#41312b';x.lineWidth=1;x.strokeRect(bx,by,180,64);
      x.fillStyle='#9a8a78';x.font='13px Georgia,serif';x.textAlign='center';x.fillText(a[1].toUpperCase(),bx+90,by+20);x.fillStyle='#e8dcc8';x.font='32px Georgia,serif';x.fillText(String(n[a[0]]),bx+90,by+54);x.textAlign='left'});
    x.fillStyle='#c4a15a';x.font='16px Georgia,serif';x.fillText('Defesa '+n.def+'  ·  Iniciativa '+n.ini+'  ·  Mov. '+n.mov+'  ·  Corrupção '+n.cor,310,424);
    x.fillStyle='#e8dcc8';x.font='16px Georgia,serif';
    x.fillText(fit('Habilidades: '+(S.habs.filter(function(h){return h.n}).map(function(h){return h.n}).join(' · ')||'—'),820),40,462);
    x.fillText(fit('Inventário: '+(S.inv.filter(function(i){return i.n}).map(function(i){return i.n+(i.q>1?' ×'+i.q:'')}).join(', ')||'—')+(f.moedas?'  |  '+f.moedas:''),820),40,494)}
  if(S.img){var im=new Image();im.onload=function(){draw(im)};im.src=S.img}else draw(null)}
function dmsg(t){$('#dmsg').textContent=t}
function pngBlob(){return new Promise(function(r){$('#cv').toBlob(r,'image/png')})}
$('#disc').addEventListener('click',function(){flush();$('#txt').value=ftxt();card();var l=$('#txt').value.length;dmsg(l>2000?'Texto com '+l+' caracteres: o Discord aceita até 2000 por mensagem. Prefira a imagem.':'');$('#dlg').hidden=false});
$('#closed').addEventListener('click',function(){$('#dlg').hidden=true});
$('#dlg').addEventListener('click',function(e){if(e.target===this)this.hidden=true});
$('#cptxt').addEventListener('click',async function(){var t=$('#txt');try{await navigator.clipboard.writeText(t.value);dmsg('Texto copiado. É só colar no Discord.')}catch(e){t.focus();t.select();try{document.execCommand('copy');dmsg('Texto copiado. É só colar no Discord.')}catch(e2){dmsg('Selecione o texto e copie manualmente.')}}});
$('#cpimg').addEventListener('click',async function(){try{var b=await pngBlob();await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);dmsg('Imagem copiada. Cole no Discord com Ctrl+V.')}catch(e){dmsg('Seu navegador não deixou copiar. Use Baixar PNG.')}});
function saveBlob(b,name){var u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000)}
function slug(){return (S.f.nome||'personagem').replace(/[^\w\-]+/g,'_')}
$('#dlimg').addEventListener('click',async function(){saveBlob(await pngBlob(),slug()+'.png');dmsg('Imagem baixada.')});
$('#exp').addEventListener('click',function(){flush();saveBlob(new Blob([JSON.stringify({fichaSombria:1,cur:S.id,chars:store.chars})],{type:'application/json'}),'ficha-sombria-backup.json');status('Backup baixado.')});
$('#imp').addEventListener('click',function(){$('#impf').click()});
$('#impf').addEventListener('change',function(){var f=this.files[0];this.value='';if(!f)return;var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result),list=d.chars?Object.keys(d.chars).map(function(k){return d.chars[k]}):(d.n?[d]:[]);
    if(!list.length)throw 0;flush();list.forEach(function(c){var m=merge(c);store.chars[m.id]=m});
    S=store.chars[(d.cur&&store.chars[d.cur])?d.cur:merge(list[0]).id];store.cur=S.id;write('Backup importado ✓');fill()}catch(e){status('Arquivo inválido.')}};r.readAsText(f)});

fill();

})();
</script>
</body></html>
